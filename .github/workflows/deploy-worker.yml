name: Deploy MVP worker

# 这个沙盒开发环境的出站网络策略禁止访问 api.cloudflare.com，所以部署改由
# GitHub Actions 的运行器代为执行：创建 D1 数据库、建表、写入密钥、发布 Worker、
# 初始化超级管理员，全部自动完成，只需要仓库里配好 Secrets。

on:
  push:
    branches:
      - claude/english-exam-question-bank-a8nbiu
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

env:
  WORKER_NAME: eng1300-mvp
  D1_NAME: eng1300-mvp

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::缺少仓库 Secret「CLOUDFLARE_API_TOKEN」。请到 Settings → Secrets and variables → Actions 添加后重新运行。"
            exit 1
          fi

      - name: Install dependencies
        working-directory: worker
        run: npm install

      - name: Resolve Cloudflare account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          VERIFY=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify")
          echo "Token 状态：$(echo "$VERIFY" | jq -r '.result.status // "unknown"')"
          if [ "$(echo "$VERIFY" | jq -r '.success')" != "true" ]; then
            echo "::error::Cloudflare 拒绝了这个 API Token，请检查是否填错或已过期。"
            echo "$VERIFY" | jq -c '.errors // .'
            exit 1
          fi

          ACCOUNT_ID=""
          # 1) 优先使用显式配置的 Account ID
          if [ -n "$ACCOUNT_ID_SECRET" ]; then
            ACCOUNT_ID="$ACCOUNT_ID_SECRET"
            echo "使用 Secret 中配置的 Account ID。"
          fi

          # 2) 否则尝试列出账号（需要 Token 具备 Account Settings:Read 权限）
          if [ -z "$ACCOUNT_ID" ]; then
            RESP=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts")
            ACCOUNT_ID=$(echo "$RESP" | jq -r '.result[0].id // empty')
            [ -n "$ACCOUNT_ID" ] && echo "通过账号列表接口自动识别到账号。"
          fi

          # 3) 再退一步：从域名（zone）信息里反查所属账号
          if [ -z "$ACCOUNT_ID" ]; then
            ZONES=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/zones")
            ACCOUNT_ID=$(echo "$ZONES" | jq -r '.result[0].account.id // empty')
            [ -n "$ACCOUNT_ID" ] && echo "通过域名信息反查到账号。"
          fi

          if [ -z "$ACCOUNT_ID" ]; then
            echo "::error::拿不到 Cloudflare Account ID。这个 Token 没有 Account Settings:Read 权限，也查不到任何域名。请添加仓库 Secret「CLOUDFLARE_ACCOUNT_ID」：登录 Cloudflare 控制台 → 左侧 Workers & Pages，页面右侧或浏览器地址栏 dash.cloudflare.com/<这一串就是 Account ID>/workers。"
            exit 1
          fi

          echo "::add-mask::$ACCOUNT_ID"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Ensure workers.dev subdomain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          SUB=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | jq -r '.result.subdomain // empty')
          if [ -z "$SUB" ]; then
            CAND="eng1300-$(echo "$CLOUDFLARE_ACCOUNT_ID" | cut -c1-8)"
            echo "账号还没有 workers.dev 子域名，尝试注册：$CAND"
            RESP=$(curl -sS -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' --data "{\"subdomain\":\"$CAND\"}" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")
            if [ "$(echo "$RESP" | jq -r '.success')" != "true" ]; then
              echo "::error::注册 workers.dev 子域名失败，请手动在 Cloudflare 控制台 Workers 页面设置一次子域名后重跑。"
              echo "$RESP" | jq -c '.errors // .'
              exit 1
            fi
            SUB="$CAND"
          fi
          echo "workers.dev 子域名：$SUB"
          echo "WORKERS_SUBDOMAIN=$SUB" >> "$GITHUB_ENV"

      - name: Find or create D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          BASE="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          LIST=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$BASE?name=$D1_NAME")
          if [ "$(echo "$LIST" | jq -r '.success')" != "true" ]; then
            echo "::error::读取 D1 数据库列表失败。请确认 API Token 含有 D1:Edit 权限（Cloudflare 后台 → API Tokens → 编辑该 Token → 添加 Account / D1 / Edit）。"
            echo "$LIST" | jq -c '.errors // .'
            exit 1
          fi
          DB_ID=$(echo "$LIST" | jq -r --arg n "$D1_NAME" '[.result[] | select(.name==$n)][0].uuid // empty')
          if [ -z "$DB_ID" ]; then
            echo "数据库不存在，正在创建：$D1_NAME"
            CREATE=$(curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' --data "{\"name\":\"$D1_NAME\"}" "$BASE")
            if [ "$(echo "$CREATE" | jq -r '.success')" != "true" ]; then
              echo "::error::创建 D1 数据库失败。"
              echo "$CREATE" | jq -c '.errors // .'
              exit 1
            fi
            DB_ID=$(echo "$CREATE" | jq -r '.result.uuid')
          fi
          echo "D1 database id: $DB_ID"
          echo "D1_DATABASE_ID=$DB_ID" >> "$GITHUB_ENV"

      - name: Point wrangler.toml at the database
        working-directory: worker
        run: |
          sed -i "s|^database_id = \".*\"|database_id = \"$D1_DATABASE_ID\"|" wrangler.toml
          grep '^database_id' wrangler.toml

      - name: Apply database migration
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          PAYLOAD=$(jq -n --arg sql "$(cat migrations/0001_init.sql)" '{sql:$sql}')
          RESP=$(curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' --data "$PAYLOAD" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/query")
          if [ "$(echo "$RESP" | jq -r '.success')" != "true" ]; then
            echo "::error::建表失败。"
            echo "$RESP" | jq -c '.errors // .'
            exit 1
          fi
          echo "users 表已就绪。"

      - name: Deploy worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      - name: Ensure worker secrets
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          EXISTING=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/secrets" \
            | jq -r '[.result[]?.name] | join(" ")')
          echo "已存在的密钥：${EXISTING:-（无）}"

          if ! echo " $EXISTING " | grep -q " JWT_SECRET "; then
            printf '%s' "$(openssl rand -hex 32)" | npx wrangler secret put JWT_SECRET
            echo "已生成并写入 JWT_SECRET。"
          fi

          # SETUP_TOKEN 每次运行都轮换成新值：它只在用户表为空时才有用，
          # 这样即使某次初始化失败，下一次运行也仍然知道令牌、可以重试。
          TOKEN_VALUE=$(openssl rand -hex 24)
          echo "::add-mask::$TOKEN_VALUE"
          printf '%s' "$TOKEN_VALUE" | npx wrangler secret put SETUP_TOKEN
          echo "SETUP_TOKEN_VALUE=$TOKEN_VALUE" >> "$GITHUB_ENV"

      - name: Wait for the worker to respond
        run: |
          URL="https://$WORKER_NAME.$WORKERS_SUBDOMAIN.workers.dev"
          echo "WORKER_URL=$URL" >> "$GITHUB_ENV"
          # 新注册的 workers.dev 子域名要等 Cloudflare 签发 HTTPS 证书，
          # 这期间 TLS 握手会直接失败，需要耐心轮询。
          for i in $(seq 1 40); do
            CODE=$(curl -sS -m 15 -o /dev/null -w '%{http_code}' "$URL/api/health" 2>/dev/null || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "服务已就绪（第 $i 次探测）。"
              exit 0
            fi
            echo "第 $i 次探测返回 $CODE，15 秒后重试…"
            sleep 15
          done
          echo "::error::等待约 10 分钟后服务仍不可访问。新子域名的 HTTPS 证书签发有时需要更久，稍后重跑本流水线即可。"
          exit 1

      - name: Bootstrap super admin
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -z "$ADMIN_PASSWORD" ]; then
            echo "::warning::未设置仓库 Secret「ADMIN_PASSWORD」，跳过超级管理员初始化。"
            exit 0
          fi
          CODE=$(curl -sS -m 30 -o /tmp/setup.json -w '%{http_code}' -X POST "$WORKER_URL/api/setup" \
            -H "X-Setup-Token: $SETUP_TOKEN_VALUE" -H 'Content-Type: application/json' \
            --data "$(jq -n --arg p "$ADMIN_PASSWORD" '{username:"admin",password:$p}')" 2>/dev/null || echo 000)
          case "$CODE" in
            201) echo "超级管理员 admin 创建成功。" ;;
            409) echo "用户表已有数据，之前已初始化过，跳过。" ;;
            *)   echo "::error::初始化超级管理员失败，HTTP $CODE"; cat /tmp/setup.json 2>/dev/null || true; exit 1 ;;
          esac

      - name: Verify deployment
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          FAIL=0
          check() {
            if [ "$2" = "$3" ]; then echo "  OK   $1"; else echo "  FAIL $1（期望 $3，实际 $2）"; FAIL=1; fi
          }

          CODE=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' "$WORKER_URL/api/health" || echo 000)
          check "健康检查" "$CODE" "200"

          CODE=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' "$WORKER_URL/api/me" || echo 000)
          check "未登录访问 /api/me 被拒绝" "$CODE" "401"

          if [ -n "$ADMIN_PASSWORD" ]; then
            BODY=$(curl -sS -m 20 -X POST "$WORKER_URL/api/auth/login" \
              -H 'Content-Type: application/json' \
              --data "$(jq -n --arg p "$ADMIN_PASSWORD" '{username:"admin",password:$p}')" || echo '{}')
            ROLE=$(echo "$BODY" | jq -r '.user.role // "none"')
            check "admin 登录并返回超级管理员角色" "$ROLE" "SUPER_ADMIN"

            TOKEN=$(echo "$BODY" | jq -r '.token // empty')
            if [ -n "$TOKEN" ]; then
              echo "::add-mask::$TOKEN"
              CODE=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' "$WORKER_URL/api/admin/users" \
                -H "Authorization: Bearer $TOKEN" || echo 000)
              check "超级管理员可访问后台用户接口" "$CODE" "200"
            fi
          fi

          [ "$FAIL" -eq 0 ] || { echo "::error::线上验证未全部通过。"; exit 1; }
          echo "线上验证全部通过。"

      - name: Summary
        run: |
          {
            echo "## 部署完成"
            echo ""
            echo "**公网地址：** $WORKER_URL"
            echo ""
            echo "- 健康检查：\`GET $WORKER_URL/api/health\`"
            echo "- 登录：\`POST $WORKER_URL/api/auth/login\`"
            echo "- 后台用户管理（仅超级管理员）：\`GET $WORKER_URL/api/admin/users\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "DEPLOYED_URL=$WORKER_URL"
