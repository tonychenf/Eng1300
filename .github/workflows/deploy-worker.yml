name: Deploy XLearn worker

# 这个沙盒开发环境的出站网络策略禁止访问 api.cloudflare.com，所以部署改由
# GitHub Actions 的运行器代为执行：创建 D1 数据库、建表、写入密钥、发布 Worker、
# 初始化超级管理员，全部自动完成，只需要仓库里配好 Secrets。

on:
  # 部署只从 main 来（2026-10-07 用户定的）：各会话在自己的 claude/... 分支上开发，开 PR 合进 main。
  # 以前写死的是某一个会话的分支名，换一个会话、分到新分支名，推上去既不部署也不跑测试，而且不报错。
  push:
    branches:
      - main
    paths:
      - 'worker/**'
      - 'web/**'
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/deploy-worker.yml'
  # PR 上只跑测试门（deploy job 见下面的 if），合进 main 之前就知道红没红。路径和上面一样（两处同改）
  pull_request:
    branches:
      - main
    paths:
      - 'worker/**'
      - 'web/**'
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/deploy-worker.yml'
  # 以前这里有一个「强制重新导入全部题库」的开关。导入过的题库文件不许改、导入过的章节
  # 不再重导（CR-H4），那个开关和这条规矩矛盾，去掉了。
  workflow_dispatch:
    inputs:
      # 找不到数据库时，只有勾了这个才新建（CR-M15）。平时库不见了是事故：新建一个空库顶上，
      # 站点看起来一切正常，学员数据却全没了——停下来照 docs/数据恢复手册.md 处理。
      create_database:
        description: '首次部署，允许新建数据库（库已经存在时勾了也不会动它）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # 部署（推送到 main、手动触发）排一队、不互相取消；PR 上的测试各排各的，不挡部署
  group: ${{ github.event_name == 'pull_request' && format('pr-test-{0}', github.event.pull_request.number) || 'deploy-worker' }}
  cancel-in-progress: false

env:
  WORKER_NAME: xlearn
  # 库名不在这里写：只认 worker/wrangler.toml 的 database_name（deploy job 第一步读进来，CR-M6）。
  # 从备份恢复到新库后切换过去，就是改那一行；这里另写一份，改一处漏一处。

jobs:
  # CI 测试门（CR-H3）：先跑全套回归，红了就不部署。以前推送即上线，中间没有任何自动测试，
  # 本地回归跑没跑、跑的是不是这一版，全凭自觉。
  # 这个 job 不碰任何 Secret：测试只用本地库和本地服务，线上凭据不该出现在跑测试的机器上。
  # 浏览器实测（ui-*）不在这里跑——它们写死了开发沙箱里的 Chromium 路径；改前端时在本地跑 --ui。
  test:
    # 固定在 24.04（2026-10-07）：GitHub 10 月 19 日起把 ubuntu-latest 换成 26.04，自带工具的版本会跟着变
    #（sqlite、python、openssl……部署里的备份加密、导出重排都靠它们）。要换就专门换一次、看着它跑绿，
    # 不让它在哪次推送时悄悄换掉。d1-drill、d1-restore、prod-e2e 同样固定。
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          # 下一步要拿推送前的版本比对，浅克隆取不到它
          fetch-depth: 0

      # 导入过的题库文件不许改（CR-H4）：这次推送改动或删除了已有的题库文件、题目图片，直接红，
      # 代码都不部署。真正兜底的是部署时导题库那一步（比对库里的指纹）；这里让它更早红，并且连图片
      # 也看得到——图片随前端上传，改了图已导入的题立刻换图，导题库那一步看不见。
      - name: Imported question-bank files must not change
        # PR 上拿目标分支（main）当前的版本比；推送到 main 时拿推送前的版本比
        run: bash scripts/ci/check-bank-files.sh "${{ github.event.pull_request.base.sha || github.event.before }}" "${{ github.sha }}"

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm install --prefix worker --no-audit --no-fund
          npm install --prefix web --no-audit --no-fund

      - name: Build frontend, bank assets and seeds
        # 都是测试的输入、也都不进 git：前端产物（wrangler dev 的 [assets] 指着它，没有它服务起不来）、
        # 题库资源（必须排在 vite 之后，vite 会清空 worker/public）、种子 SQL。
        run: |
          npm run build --prefix web
          node scripts/build-bank-assets.mjs
          node scripts/build-seed-sql.mjs

      - name: Regression (server suites + node unit tests, 4 in parallel)
        working-directory: worker
        env:
          # 本轮目录和各套的临时文件落在这里，失败时下一步把日志传上去
          TMPDIR: ${{ runner.temp }}
          # 和开发沙箱一致（POSIX）：各套是在这个区域设置下写、下验证的
          LC_ALL: C
        run: bash test/run-all.sh

      - name: Keep the logs of a failed run
        # 流水线日志有长度上限，汇总表之外的细节——每套的完整输出、dev 日志、读库走向——在这里。
        # 只传日志：失败套件的沙箱里有 node_modules 的软链，整个目录传上去会把依赖一起打包。
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: regression-logs
          path: |
            ${{ runner.temp }}/xlearn-regress.*/*.log
            ${{ runner.temp }}/xlearn-regress.*/*.d1trace
          retention-days: 7
          if-no-files-found: warn

  deploy:
    # 测试红了就不部署（CR-H3）。手动触发的部署也一样要先过测试。PR 上只跑测试，不部署。
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Database name (single source - worker/wrangler.toml)
        run: |
          N=$(bash scripts/ci/d1-name.sh)
          echo "D1_NAME=$N" >> "$GITHUB_ENV"
          echo "数据库：$N"

      # 本平台是从 Eng1300 复制改造来的，wrangler.toml 里的 database_id 会原样
      # 带过来。没清掉的话，下面的迁移会直接在 Eng1300 的线上库上建表改表——
      # 而且迁移都写成 IF NOT EXISTS，不会报任何错，流水线全绿、老站数据被静默改坏。
      # 这一步必须排在所有 d1 execute 与 deploy 之前。守卫本身有单测：
      # worker/test/db-isolation.sh
      - name: Guard against writing to the copied platform's database
        run: bash scripts/ci/check-db-isolation.sh

      - name: Check required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::缺少仓库 Secret「CLOUDFLARE_API_TOKEN」。请到 Settings → Secrets and variables → Actions 添加后重新运行。"
            exit 1
          fi
          # 部署动库之前要先做加密备份（CR-M6），没有口令就不往下走——这时什么都还没碰
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::缺少仓库 Secret「BACKUP_PASSPHRASE」（整库备份的加密口令）。到 Settings → Secrets and variables → Actions 新建，值用密码管理器生成（24 位以上），自己另存一份——存进去就读不回来，丢了备份就打不开。"
            exit 1
          fi

      - name: Install dependencies
        env:
          # worker 的 devDependencies 里有 playwright（只给浏览器测试用）。
          # 部署用不到浏览器，别让它的 postinstall 白下载几百兆。
          # 不能改用 --omit=dev：wrangler 本身也在 devDependencies 里。
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm install --prefix worker --no-audit --no-fund
          npm install --prefix web --no-audit --no-fund

      - name: Build frontend
        # vite 的产物直接落到 worker/public，随 wrangler deploy 一起上传。
        # 拷题库资源必须排在 vite 之后：vite 的 emptyOutDir 会把 worker/public 清空，
        # 反过来的话页面正常、题目里的图全裂，而且不报错（§6.4.6、G10）。
        run: |
          npm run build --prefix web
          node scripts/build-bank-assets.mjs
          ls -la worker/public

      - name: Resolve Cloudflare account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/ci/resolve-account.sh

      - name: Ensure workers.dev subdomain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash scripts/ci/ensure-subdomain.sh

      - name: Find D1 database (create only when asked)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ALLOW_CREATE_DB: ${{ github.event_name == 'workflow_dispatch' && inputs.create_database }}
        run: bash scripts/ci/find-or-create-d1.sh

      - name: Point wrangler.toml at the database
        working-directory: worker
        run: |
          sed -i "s|^database_id = \".*\"|database_id = \"$D1_DATABASE_ID\"|" wrangler.toml
          grep '^database_id' wrangler.toml

      # 回填之后再查一次：这次 D1_DATABASE_ID 有值了，能比对"解析出来的 ID"
      # 与"写进 toml 的 ID"是否一致，也能拦住解析步骤本身拿错库的情况。
      - name: Re-check isolation after the database id is filled in
        run: bash scripts/ci/check-db-isolation.sh

      # ---- 动库之前（CR-M6）：下面的重建、补列、迁移、导题库都会写库 ----
      # 恢复点：这一刻的时间旅行书签打进日志和摘要。这次部署弄坏了数据，d1-restore 填它就回到部署前。
      # 只读；读不到只告警（按北京时间填时间点照样能恢复）。
      - name: Record a restore point (time travel bookmark)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash scripts/ci/d1-restore-point.sh

      # 整库加密备份，存成本次运行的附件、留 90 天：时间旅行只能回到 7 天内、库被删了也跟着没。
      # 仓库是公开的，附件谁都能下，所以只上传密文；wrangler 打印的整库下载链接也不进日志。
      # 失败就停：这时还什么都没写。新建的空库没东西可备份，跳过。
      - name: Back up the database (encrypted)
        if: env.D1_JUST_CREATED != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: bash scripts/ci/d1-backup.sh --remote "$RUNNER_TEMP/d1-backup"

      - name: Keep the encrypted backup for 90 days
        if: env.D1_JUST_CREATED != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: d1-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/d1-backup/
          retention-days: 90
          if-no-files-found: error

      # N3：线上那个库是 N0 时按旧结构建的，迁移里全是 CREATE TABLE IF NOT EXISTS，
      # 对已经存在的表一行都不会改。必须排在迁移之前：0002 里新加的
      # idx_questions_subject 建在 subject_id 上，旧表没这一列，迁移会当场断在那句。
      # 新库或已经换过结构的库走到这里是零写入的空操作。
      - name: Rebuild legacy tables for the subject pack
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash scripts/ci/rebuild-legacy-schema.sh --remote

      # ai_settings.purpose 的 CHECK 要放宽一档（N7d 的「文字解析 AI」）。
      # CHECK 改不动，只能重建表；这张表没有子表引用，重建是干净的。
      # 自带门闩（n7d-ai-purposes），做过就不再做——它会删表，不能每次重新判断。
      # 必须排在迁移之前：迁移里的 INSERT 一旦写 TEXT_PARSING，旧 CHECK 会把整步顶掉。
      - name: Widen ai_settings purposes for the text-parsing config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash scripts/ci/rebuild-ai-purposes.sh --remote

      # 补列必须排在迁移**之前**。两条理由，第二条是部署 #48 用失败换来的：
      #   1. 线上那些表是早先的部署建的，迁移里的 CREATE TABLE IF NOT EXISTS
      #      不会给它们加列（0002 那条老坑），只能靠这一步。
      #   2. **迁移里只要有一条语句提到新列，在旧库上就会整条失败**——哪怕那条语句
      #      带着门闩、一行都不会插。SQLite 在准备语句时就校验列名，不看 WHERE。
      #      0009 的题型种子正是这样：门闩早就合上了，但它的列清单里有 answer_shape，
      #      于是旧库上直接报 "table ... has no column named answer_shape"，
      #      迁移整步红掉、后面全跳过。
      # 加列是增量动作、不删数据，所以按列检测、每次部署重跑，不需要门闩。
      # 新库走到这里时表还没建，整步是零写入的空操作，由迁移把表连列一起建好。
      - name: Ensure new columns exist on already-created tables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash scripts/ci/ensure-columns.sh --remote

      # 迁移全部写成 IF NOT EXISTS / INSERT OR IGNORE，可以反复执行。
      # 搬进脚本是因为恢复流水线（d1-restore）回滚之后也要跑同一份。
      - name: Apply database migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash scripts/ci/apply-migrations.sh --remote

      # 部署排在题库导入之前。导入受 D1 每日写入额度限制，额度耗尽时会失败；
      # 早先它排在前面，一失败后面的部署就整步跳过，连续八次运行的 Worker 代码
      # 一行都没上线——数据装载的额度问题不该挡住代码发布。迁移仍排在最前，
      # 因为新代码可能依赖新表。
      - name: Deploy worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      - name: Ensure worker secrets
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash ../scripts/ci/ensure-worker-secrets.sh

      # 导题库之前记下哪些章节是已发布的，线上验证拿它逐章比对：部署不该改变任何章节的
      # 发布状态——撤回的不能被放回去，已发布的不能被部署弄丢（CR-M14）。
      - name: Record which chapters are published before seeding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PUBLISHED_BEFORE_FILE: ${{ runner.temp }}/published-before.txt
        run: bash scripts/ci/record-published.sh --remote

      # 导入过的章节不再重导：没变的跳过，文件被改了就拒绝（库里一行不动），新章节才导入（CR-H4）。
      # 拒绝的写进清单，由线上验证报红并点名——这一步本身不因此失败，后面的步骤照常跑完。
      # 以前接在后面的「放行」一步（republish-reseeded.sql）也就没有东西可放了，一起拆掉（CR-H2 根治）。
      - name: Seed question bank
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SEED_REFUSED_FILE: ${{ runner.temp }}/seed-refused.txt
        run: bash scripts/ci/seed-if-changed.sh

      - name: Wait for the worker to respond
        run: bash scripts/ci/wait-for-worker.sh

      - name: Bootstrap super admin
        env:
          # 两个名字都认：ADMIN_PASSWORD 是最早用的，ADMIN_PASS 是后来加的
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: bash scripts/ci/bootstrap-admin.sh

      # 流水线用自己的管理员账号 ci_deploy（运-2，2026-10-07）：每次现生成随机密码写进库再登录，
      # 不存、不打日志。以前用 Secret 里的 admin 密码：管理员在后台改了密码，下一次部署就登录不上；
      # admin 被人试错锁住，还得每次部署替它清锁定——那等于每次部署都给猜密码的人重置一次计数，一并去掉。
      # 必须排在「Bootstrap super admin」后面：新库上 /api/setup 只在用户表为空时建 admin，先建了
      # ci_deploy，admin 就永远建不出来。admin 忘了密码走手动流水线 admin-reset.yml。
      - name: Pipeline account token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash scripts/ci/ci-account-token.sh --remote

      - name: Bootstrap student accounts
        env:
          STUDENT_PASSWORD: ${{ secrets.STUDENT_PASSWORD }}
        run: bash scripts/ci/bootstrap-students.sh

      # 三档都只补不改（CR-M10）：库里配过就不动，仓库变量和 Secret 只管第一次部署的初值。
      # 以后换模型、换 Key 都在后台「AI 配置」页改——在这里换 SILICONFLOW_API_KEY 不会同步到线上。
      - name: Configure AI providers
        env:
          # 复用 ai-smoke-test.yml 已经配好的那个 Secret
          AI_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_PARSING_MODEL: ${{ vars.AI_PARSING_MODEL }}
          AI_TUTORING_MODEL: ${{ vars.AI_TUTORING_MODEL }}
          AI_TEXT_PARSING_MODEL: ${{ vars.AI_TEXT_PARSING_MODEL }}
        # 逻辑在脚本里：本地套件 prod-e2e-local、deploy-local 对本地服务跑的是同一份
        run: bash scripts/ci/configure-ai.sh

      # 本地套件 deploy-local 在新库上按部署顺序把这些脚本连跑三次（中间模拟后台操作），
      # 线上验证要全过，并且证明它在写入没落库、发布状态被部署改了的时候会红。
      - name: Verify deployment
        env:
          PUBLISHED_BEFORE_FILE: ${{ runner.temp }}/published-before.txt
          SEED_REFUSED_FILE: ${{ runner.temp }}/seed-refused.txt
        run: bash scripts/ci/verify-deployment.sh

      - name: Summary
        run: |
          {
            echo "## XLearn 部署完成"
            echo ""
            echo "**公网地址：** $WORKER_URL"
            echo ""
            echo "- 健康检查：\`GET $WORKER_URL/api/health\`"
            echo "- 登录：\`POST $WORKER_URL/api/auth/login\`"
            echo "- 学员入口：$WORKER_URL/login （登录后落到学科选择页）"
            echo "- 学科接口：\`GET $WORKER_URL/api/me/subjects\`"
            echo "- 后台入口：$WORKER_URL/admin/login"
            echo "- 后台用户管理（仅超级管理员）：\`GET $WORKER_URL/api/admin/users\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "DEPLOYED_URL=$WORKER_URL"
