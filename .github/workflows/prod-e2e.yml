name: 线上端到端实测

# 拿探针账号在真实线上环境走完整条链路：组卷 → 逐题作答 → 交卷判分 →
# 调真实 AI 服务商批改作文与分析错题 → 错题本 → 能力评估；另有一段上传出题：
# 传一份 4 道题的小 docx，让真实模型出答案和解析，核对落库后删掉（CR-M4）。
#
# 为什么单独一个流水线、且只能手动触发：
#
# 一、这条链路会真的调用硅基流动，花的是真钱。不该每次推代码都跑一遍。
# 二、它会往库里写一次完整的模考记录，占 D1 每日写入额度。
# 三、开发沙箱的出站策略同时拒绝 workers.dev 和 api.siliconflow.cn，本地
#     两头都够不着；AI 部分本地只能用替身，而替身返回什么形状是我们自己
#     写的，证明不了真实模型的输出扛不扛得住解析。这个流水线是唯一能验证
#     "真实模型 + 我们的提示词 + 我们的解析"这一整段的地方。

on:
  # 只手动触发（2026-10-07 起）。以前流水线在非默认分支上，只手动触发的流水线 GitHub 认不得，
  # 只好加一个"改了自己就跑"的推送触发——于是改 prod-e2e.sh 一推送就花一次钱，为了让实测打在
  # 新版本上，每批还得拆两个提交、等第一次部署完再推第二个。现在流水线在默认分支 main 上，
  # 手动触发直接可用：部署成功之后由人点一次。
  workflow_dispatch:

permissions:
  contents: read

# 和部署排同一队（2026-10-08）：两边都用流水线账号 ci_deploy，每次取令牌都换密码、作废上一个令牌——
# 同时跑的话，后取令牌的那个会让先取的那个后面每一步都 401。部署跑着时点了实测，实测排在部署后面等；
# 只是同一队里只留一个"等着的"：等的时候又来一次推送，排着的实测会被换下来（运行页写 cancelled），再点一次就行
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-24.04
    env:
      # 线上地址本来就是公开的（README 里写着）。以前这里一直空着，
      # 所以 XLearn 复制过来之后这条流水线一次都没跑成过（#4、#5 都停在下一步）
      WORKER_URL: https://xlearn.eng1300-79fe2787.workers.dev
    steps:
      - uses: actions/checkout@v5

      # WORKER_URL 空着的时候，下面每一步都会去请求一个空地址，报出来的是
      # curl 的参数错误，看不出根因。这里先把话说清楚。
      - name: Check the worker url is filled in
        run: |
          if [ -z "$WORKER_URL" ]; then
            echo "::error::WORKER_URL 还没填。本平台首次部署后，deploy-worker 流水线会在运行摘要里输出公网地址，把它填进 .github/workflows/prod-e2e.yml 的 env.WORKER_URL 再跑这条线。"
            exit 1
          fi
          echo "目标站点：$WORKER_URL"

      # 管理员令牌用流水线自己的账号 ci_deploy（运-2）：现生成随机密码写进库再登录。
      # 写库要先找到线上库，下面几步和部署里的一样（只找、不建）
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --prefix worker --no-audit --no-fund

      - name: Database name (single source - worker/wrangler.toml)
        run: echo "D1_NAME=$(bash scripts/ci/d1-name.sh)" >> "$GITHUB_ENV"

      - name: Guard against writing to the copied platform's database
        run: bash scripts/ci/check-db-isolation.sh

      - name: Resolve Cloudflare account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/ci/resolve-account.sh

      - name: Find the database (never creates)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ALLOW_CREATE_DB: 'false'
        run: bash scripts/ci/find-or-create-d1.sh

      - name: Point wrangler.toml at the database
        working-directory: worker
        run: |
          sed -i "s|^database_id = \".*\"|database_id = \"$D1_DATABASE_ID\"|" wrangler.toml
          grep '^database_id' wrangler.toml

      - name: Re-check isolation after the database id is filled in
        run: bash scripts/ci/check-db-isolation.sh

      - name: Pipeline account token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash scripts/ci/ci-account-token.sh --remote

      - name: Run end-to-end test
        run: bash scripts/ci/prod-e2e.sh
