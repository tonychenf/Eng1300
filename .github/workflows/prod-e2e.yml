name: 线上端到端实测

# 拿探针账号在真实线上环境走完整条链路：组卷 → 逐题作答 → 交卷判分 →
# 调真实 AI 服务商批改作文与分析错题 → 错题本 → 能力评估；另有一段上传出题：
# 传一份 4 道题的小 docx，让真实模型出答案和解析，核对落库后删掉（CR-M4）。
#
# 为什么单独一个流水线、且只能手动触发：
#
# 一、这条链路会真的调用硅基流动，花的是真钱。不该每次推代码都跑一遍。
# 二、它会往库里写一次完整的模考记录，占 D1 每日写入额度。
# 三、开发沙箱的出站策略同时拒绝 workers.dev 和 api.siliconflow.cn，本地
#     两头都够不着；AI 部分本地只能用替身，而替身返回什么形状是我们自己
#     写的，证明不了真实模型的输出扛不扛得住解析。这个流水线是唯一能验证
#     "真实模型 + 我们的提示词 + 我们的解析"这一整段的地方。

on:
  # 只手动触发的流水线在非默认分支上注册不了：GitHub 要它至少跑过一次才认得，
  # 而没注册就没法手动触发，成了死结。所以给一个只盯自己这两个文件的 push
  # 触发——改测试本身时跑一次正好，平时推别的代码不会触发。
  push:
    branches:
      - claude/eng1300-multidisciplinary-platform-ozri7n
    paths:
      - '.github/workflows/prod-e2e.yml'
      - 'scripts/ci/prod-e2e.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prod-e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-24.04
    env:
      # 线上地址本来就是公开的（README 里写着）。以前这里一直空着，
      # 所以 XLearn 复制过来之后这条流水线一次都没跑成过（#4、#5 都停在下一步）
      WORKER_URL: https://xlearn.eng1300-79fe2787.workers.dev
    steps:
      - uses: actions/checkout@v5

      # WORKER_URL 空着的时候，下面每一步都会去请求一个空地址，报出来的是
      # curl 的参数错误，看不出根因。这里先把话说清楚。
      - name: Check the worker url is filled in
        run: |
          if [ -z "$WORKER_URL" ]; then
            echo "::error::WORKER_URL 还没填。本平台首次部署后，deploy-worker 流水线会在运行摘要里输出公网地址，把它填进 .github/workflows/prod-e2e.yml 的 env.WORKER_URL 再跑这条线。"
            exit 1
          fi
          echo "目标站点：$WORKER_URL"

      - name: Get admin token
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: bash scripts/ci/get-admin-token.sh

      - name: Run end-to-end test
        run: bash scripts/ci/prod-e2e.sh
