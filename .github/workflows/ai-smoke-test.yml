name: AI API smoke test

# 开发沙盒的出站网络策略禁止访问 api.siliconflow.cn，所以 AI 接口的连通性与
# 能力检测放在 GitHub Actions 运行器上跑。这个流水线只做只读探测，不改任何数据。
#
# 验证的是题库解析的两段式设计：
#   图片 --[DeepSeek-OCR]--> 纯文本 --[Qwen3-8B]--> 结构化JSON + 考点标签

on:
  workflow_dispatch:
  push:
    branches:
      - claude/english-exam-question-bank-a8nbiu
    paths:
      - '.github/workflows/ai-smoke-test.yml'

permissions:
  contents: read

env:
  BASE_URL: https://api.siliconflow.cn/v1
  TUTOR_MODEL: Qwen/Qwen3-8B
  OCR_MODEL: deepseek-ai/DeepSeek-OCR

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret present
        env:
          KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::缺少仓库 Secret「SILICONFLOW_API_KEY」。请到 Settings → Secrets and variables → Actions 添加后重新运行。"
            exit 1
          fi

      - name: 1. 连通性与两个目标模型是否可用
        env:
          KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          CODE=$(curl -sS -m 30 -o /tmp/models.json -w '%{http_code}' \
            -H "Authorization: Bearer $KEY" "$BASE_URL/models" || echo 000)
          echo "GET /models -> HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::无法访问模型列表接口，Key 可能无效。响应："
            head -c 500 /tmp/models.json || true
            exit 1
          fi
          echo "账号可见模型数：$(jq '.data | length' /tmp/models.json)"
          for M in "$TUTOR_MODEL" "$OCR_MODEL"; do
            if jq -e --arg m "$M" '.data[] | select(.id==$m)' /tmp/models.json >/dev/null; then
              echo "  ✓ $M 在可用列表中"
            else
              echo "  ✗ $M 不在可用列表中（可能仍可调用，继续后续测试确认）"
            fi
          done

      - name: 2. 教学AI 文本对话（Qwen3-8B）
        env:
          KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          PAYLOAD=$(jq -n --arg m "$TUTOR_MODEL" '{
            model: $m,
            messages: [{role:"user", content:"用一句话解释英语中 generally 和 general 的词性区别。"}],
            max_tokens: 128
          }')
          CODE=$(curl -sS -m 90 -o /tmp/chat.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' \
            --data "$PAYLOAD" "$BASE_URL/chat/completions" || echo 000)
          echo "-> HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::$TUTOR_MODEL 调用失败：$(head -c 800 /tmp/chat.json)"
            exit 1
          fi
          echo "回复：$(jq -r '.choices[0].message.content' /tmp/chat.json | head -c 400)"
          echo "用量：$(jq -c '.usage' /tmp/chat.json)"

      - name: 3. 教学AI 结构化JSON（校验字段完整性 + 思考模式对比）
        env:
          KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          PROMPT='只输出JSON，不要任何其他文字或解释。分析这道题并按格式输出：{"knowledgePoint":"考点名","errorReason":"错因分析","memoryPoint":"记忆要点"}。题目：It is ___ (general) believed that watching TV can relax people. 需填入general的正确形式。正确答案：generally。学生答错，填的是：general'

          # 校验必须是"字段齐全"的JSON，空对象{}不算通过
          check_json() {
            local f=$1
            local C=$(jq -r '.choices[0].message.content // empty' "$f")
            if [ -z "$C" ]; then echo "EMPTY_CONTENT"; return 1; fi
            if ! echo "$C" | jq empty 2>/dev/null; then echo "INVALID_JSON"; return 1; fi
            local N=$(echo "$C" | jq -r '[.knowledgePoint, .errorReason, .memoryPoint] | map(select(. != null and . != "")) | length')
            if [ "$N" -lt 3 ]; then echo "MISSING_FIELDS(仅${N}/3): $(echo "$C" | jq -c .)"; return 1; fi
            echo "$C" | jq -c .
            return 0
          }

          run_case() {
            local label=$1 tokens=$2 thinking=$3
            echo ""
            echo "=== $label (max_tokens=$tokens, enable_thinking=$thinking) ==="
            local OK=0
            for i in 1 2 3; do
              if [ "$thinking" = "null" ]; then
                PAYLOAD=$(jq -n --arg m "$TUTOR_MODEL" --arg p "$PROMPT" --argjson t "$tokens" \
                  '{model:$m, messages:[{role:"user",content:$p}], response_format:{type:"json_object"}, max_tokens:$t}')
              else
                PAYLOAD=$(jq -n --arg m "$TUTOR_MODEL" --arg p "$PROMPT" --argjson t "$tokens" --argjson th "$thinking" \
                  '{model:$m, messages:[{role:"user",content:$p}], response_format:{type:"json_object"}, max_tokens:$t, enable_thinking:$th}')
              fi
              local T0=$(date +%s)
              curl -sS -m 180 -o /tmp/r.json -X POST \
                -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' \
                --data "$PAYLOAD" "$BASE_URL/chat/completions" || true
              local T1=$(date +%s)
              local RESULT
              RESULT=$(check_json /tmp/r.json) && STATUS="✓" || STATUS="✗"
              local RT=$(jq -r '.usage.completion_tokens_details.reasoning_tokens // 0' /tmp/r.json)
              local CT=$(jq -r '.usage.completion_tokens // 0' /tmp/r.json)
              echo "  第${i}次 $STATUS 耗时$((T1-T0))s 思考token=$RT/总输出$CT"
              echo "        $RESULT"
              [ "$STATUS" = "✓" ] && OK=$((OK+1))
            done
            echo "  → 字段完整成功率：$OK/3"
          }

          run_case "A 原配置（复现上次的空JSON问题）" 400 null
          run_case "B 加大token预算" 2000 null
          run_case "C 关闭思考模式" 2000 false

      - name: 4. 视觉OCR（DeepSeek-OCR 读图）
        env:
          KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          sudo apt-get install -y imagemagick fonts-dejavu >/dev/null 2>&1 || true
          # 造一张模仿真题版式的图片：短文 + 带选项的判断题
          convert -size 900x420 xc:white -pointsize 22 -font DejaVu-Sans \
            -fill black \
            -annotate +40+50 'Red Nose Day' \
            -annotate +40+95 'Red Nose Day (RND) is a well-known event in the UK.' \
            -annotate +40+130 'The aim of the day is to raise money for Comic Relief.' \
            -annotate +40+195 '1. Red Nose Day is a famous event in Britain.' \
            -annotate +70+230 'A. True     B. False     C. Not Given' \
            -annotate +40+280 '2. Comic Relief helps people all over the world.' \
            -annotate +70+315 'A. True     B. False     C. Not Given' \
            /tmp/exam.png
          echo "测试图片已生成 ($(stat -c%s /tmp/exam.png) 字节)"
          B64=$(base64 -w0 /tmp/exam.png)
          PAYLOAD=$(jq -n --arg m "$OCR_MODEL" --arg b "data:image/png;base64,$B64" '{
            model: $m,
            messages: [{role:"user", content:[
              {type:"image_url", image_url:{url:$b}},
              {type:"text", text:"请完整识别这张图片中的所有文字，保持原有换行与结构。"}
            ]}],
            max_tokens: 1024
          }')
          CODE=$(curl -sS -m 120 -o /tmp/ocr.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' \
            --data "$PAYLOAD" "$BASE_URL/chat/completions" || echo 000)
          echo "-> HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::$OCR_MODEL 调用失败：$(head -c 1000 /tmp/ocr.json)"
            echo "::error::题库图片解析依赖该模型，需要改用其它视觉模型"
            exit 1
          fi
          jq -r '.choices[0].message.content' /tmp/ocr.json > /tmp/ocr.txt
          echo "--- OCR 识别结果 ---"
          cat /tmp/ocr.txt
          echo "--------------------"
          # 用关键词命中率粗判识别质量
          HIT=0
          for W in "Red Nose Day" "Comic Relief" "Not Given" "Britain"; do
            grep -qi "$W" /tmp/ocr.txt && HIT=$((HIT+1)) && echo "  ✓ 命中: $W" || echo "  ✗ 未命中: $W"
          done
          echo "关键词命中：$HIT/4"
          [ "$HIT" -ge 3 ] || echo "::warning::OCR 识别质量可能不足以支撑真题解析，需人工评估"

      - name: 5. 端到端：OCR文本 → 结构化JSON（两段式流水线验证）
        env:
          KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          OCR_TEXT=$(cat /tmp/ocr.txt)
          PROMPT=$(printf '%s\n\n%s' \
            '下面是从一张英语真题图片OCR识别出的文字。请把它整理成JSON，只输出JSON不要其他文字。格式：{"passageTitle":"短文标题","passageText":"短文正文","questions":[{"order":题号数字,"stem":"题干","options":["A. ...","B. ...","C. ..."]}]}' \
            "$OCR_TEXT")
          PAYLOAD=$(jq -n --arg m "$TUTOR_MODEL" --arg p "$PROMPT" '{
            model: $m, messages: [{role:"user", content:$p}],
            response_format: {type:"json_object"}, max_tokens: 2000,
            enable_thinking: false
          }')
          CODE=$(curl -sS -m 180 -o /tmp/struct.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' \
            --data "$PAYLOAD" "$BASE_URL/chat/completions" || echo 000)
          echo "-> HTTP $CODE"
          C=$(jq -r '.choices[0].message.content // empty' /tmp/struct.json 2>/dev/null || echo "")
          if echo "$C" | jq empty 2>/dev/null; then
            echo "结构化成功，产出："
            echo "$C" | jq .
            QN=$(echo "$C" | jq '.questions | length')
            echo "识别出题目数：$QN（图片中实际为 2 道）"
          else
            echo "::warning::结构化失败：$(echo "$C" | head -c 400)"
          fi

      - name: 小结
        if: always()
        run: |
          {
            echo "## AI 接口探测结果"
            echo ""
            echo "| 项 | 配置 |"
            echo "|---|---|"
            echo "| 服务商 | 硅基流动（OpenAI 兼容协议） |"
            echo "| Base URL | \`$BASE_URL\` |"
            echo "| 教学 AI | \`$TUTOR_MODEL\` |"
            echo "| 题库解析 OCR | \`$OCR_MODEL\` |"
            echo ""
            echo "题库解析采用两段式：图片 → DeepSeek-OCR 取文字 → Qwen3-8B 结构化+打考点标签。"
            echo "各步骤详情见运行日志。"
          } >> "$GITHUB_STEP_SUMMARY"
