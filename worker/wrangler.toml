name = "xlearn"
main = "src/index.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "xlearn"
# database_id 留空，由部署流水线创建数据库后回填。
# 绝不能填被复制方 Eng1300 的库 ID——那会让本平台的迁移直接改坏老站数据。
# scripts/ci/check-db-isolation.sh 会在任何 d1 操作之前拦下这种情况。
database_id = ""

# 前端构建产物（web/ 由 vite 输出到这里），与 Worker 一起部署到同一个域名。
# not_found_handling 让所有前端路由回落到 index.html；
# run_worker_first 保证 /api/* 永远交给 Worker，不被 SPA 回落吃掉。
[assets]
directory = "./public"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
