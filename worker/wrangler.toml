name = "xlearn"
main = "src/index.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "xlearn"
# database_id 留空，由部署流水线创建数据库后回填。
# 绝不能填被复制方 Eng1300 的库 ID——那会让本平台的迁移直接改坏老站数据。
# scripts/ci/check-db-isolation.sh 会在任何 d1 操作之前拦下这种情况。
database_id = ""

# 前端构建产物（web/ 由 vite 输出到这里），与 Worker 一起部署到同一个域名。
# not_found_handling 让所有前端路由回落到 index.html；
# run_worker_first 保证 /api/* 永远交给 Worker，不被 SPA 回落吃掉。
[assets]
directory = "./public"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# 改进阶段 2 第三期（AI 拆题导入）：照片排队等识别的那几分钟放在这里，识别完立刻删、每个键带 1 天过期兜底。
# id 不写：本地开发由 wrangler 在本地模拟；线上由部署流水线按名字找到或新建命名空间，再把 id 填进来
# （scripts/ci/find-or-create-kv.sh）。图片不进 D1 的理由见 migrations/0021_import_jobs.sql。
[[kv_namespaces]]
binding = "IMPORT_IMAGES"

# 每分钟叫醒一次，处理导入任务里排队的页（PRD P3-C2；免费计划可用）。本地测试用 /__scheduled 手动触发。
[triggers]
crons = ["* * * * *"]
